# Ferrum development tasks (mise)
# Mirrors CI jobs so local verification matches the gate.
#
# Smallest-verification convention (PROJECT_STRUCTURE.md §8.1):
#   Rust-only change:       mise run test-rust lint-rust
#   Python-only change:     mise run dev test-python-unit
#   Extension/boundary:     mise run dev test-integration test-security
#   Full local CI parity:   mise run ci-local

# Python and Rust: use system installs (cargo, python3 on PATH).
# Only project-local CLI tools are pinned here; enable_tools prevents
# global mise python/rust from overriding PATH in this directory.
[settings]
enable_tools = ["ruff", "ty", "uv"]

[tools]
ruff = "latest"
ty = "latest"
uv = "latest"

# ---------------------------------------------------------------------------
# Setup
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Sync Python dev dependencies into the project venv"
run = "uv sync --extra dev"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[tasks.dev]
description = "Build and install the extension (debug)"
run = "uv run maturin develop"

[tasks.dev-release]
description = "Build and install the extension (release)"
run = "uv run maturin develop --release"

# ---------------------------------------------------------------------------
# Integration databases
# ---------------------------------------------------------------------------

[tasks.db-up]
description = "Start PostgreSQL, MySQL, and SQL Server test databases"
run = "docker compose -f compose.tests.yaml up -d --wait"

[tasks.db-down]
description = "Stop test databases and remove their volumes"
run = "docker compose -f compose.tests.yaml down --volumes --remove-orphans"

# ---------------------------------------------------------------------------
# Linting
# ---------------------------------------------------------------------------

[tasks.lint-rust]
description = "Rust fmt + clippy"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.lint-python]
description = "Ruff lint + format check"
run = [
  "ruff check python/ tests/",
  "ruff format --check python/ tests/",
]

[tasks.lint]
description = "Run Rust and Python linters"
depends = ["lint-rust", "lint-python"]
run = "true"

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------

[tasks.type-python]
description = "Type-check python/ferrum with ty"
run = "ty check python/ferrum"

# ---------------------------------------------------------------------------
# Rust checks
# ---------------------------------------------------------------------------

[tasks.check-rust]
description = "cargo check --workspace"
run = "cargo check --workspace"

[tasks.boundary]
description = "Ensure ferrum-core and ferrum-sql do not depend on pyo3/tokio"
run = [
  "bash -c 'echo \"Checking ferrum-core: no pyo3/tokio...\"; cargo tree -p ferrum-core --edges normal | grep -E \"pyo3|tokio\" && echo FAIL && exit 1 || echo OK'",
  "bash -c 'echo \"Checking ferrum-sql: no pyo3/tokio...\"; cargo tree -p ferrum-sql --edges normal | grep -E \"pyo3|tokio\" && echo FAIL && exit 1 || echo OK'",
]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tasks.test-rust]
description = "Run ferrum-core and ferrum-sql unit tests"
run = "cargo test -p ferrum-core -p ferrum-sql"

[tasks.test-python-unit]
description = "Run Python unit and property tests"
run = "uv run pytest tests/python/unit tests/python/property -v"

[tasks.test-integration]
description = "Alias for the PostgreSQL integration suite"
depends = ["test-integration-pg"]
run = "true"

[tasks.test-integration-pg]
description = "Run PostgreSQL integration tests"
depends = ["dev", "db-up"]
run = "FERRUM_TEST_DSN=postgresql://ferrum_test:ferrum_test@localhost:5432/ferrum_test FERRUM_TEST_REQUIRE_BACKENDS=postgres uv run pytest tests/python/integration -m integration -v"

[tasks.test-integration-mysql]
description = "Run MySQL integration tests"
depends = ["dev", "db-up"]
run = "FERRUM_TEST_MYSQL_DSN=mysql://ferrum_test:ferrum_test@127.0.0.1:3306/ferrum_test FERRUM_TEST_REQUIRE_BACKENDS=mysql uv run pytest tests/python/integration -m integration -v"

[tasks.test-integration-sqlite]
description = "Run SQLite integration tests"
depends = ["dev"]
run = """
rm -f .ferrum_test.db
trap 'rm -f .ferrum_test.db' EXIT
FERRUM_TEST_SQLITE_DSN=sqlite:///.ferrum_test.db \
  FERRUM_TEST_REQUIRE_BACKENDS=sqlite \
  uv run pytest tests/python/integration -m integration -v
"""

[tasks.test-integration-mssql]
description = "Run SQL Server integration tests"
depends = ["dev", "db-up"]
run = "FERRUM_TEST_MSSQL_DSN='mssql://ferrum_test:FerrumTest123@localhost:1433/ferrum_test?TrustServerCertificate=yes' FERRUM_TEST_REQUIRE_BACKENDS=mssql uv run pytest tests/python/integration -m integration -v"

[tasks.test-integration-all]
description = "Run integration tests against every supported backend, then stop test databases"
depends = ["dev", "db-up"]
run = """
rm -f .ferrum_test.db
cleanup() {
  rm -f .ferrum_test.db
  docker compose -f compose.tests.yaml down --volumes --remove-orphans
}
trap cleanup EXIT
FERRUM_TEST_DSN=postgresql://ferrum_test:ferrum_test@localhost:5432/ferrum_test \
  FERRUM_TEST_MYSQL_DSN=mysql://ferrum_test:ferrum_test@127.0.0.1:3306/ferrum_test \
  FERRUM_TEST_SQLITE_DSN=sqlite:///.ferrum_test.db \
  FERRUM_TEST_MSSQL_DSN='mssql://ferrum_test:FerrumTest123@localhost:1433/ferrum_test?TrustServerCertificate=yes' \
  FERRUM_TEST_REQUIRE_BACKENDS=postgres,mysql,sqlite,mssql \
  uv run pytest tests/python/integration -m integration -v
"""

[tasks.test-security]
description = "Run security qualification tests"
depends = ["dev"]
run = "uv run pytest tests/python/security -m security -v"

[tasks.test-property]
description = "Run property-based tests only"
run = "uv run pytest tests/python/property -m property -v"

[tasks.all-tests]
description = "dev + rust + python unit + integration + security tests"
depends = ["dev", "test-rust", "test-python-unit", "test-integration-all", "test-security"]
run = "true"

# ---------------------------------------------------------------------------
# Import boundary
# ---------------------------------------------------------------------------

[tasks.import-boundary]
description = "Enforce Python import boundaries (import-linter)"
run = "uv run lint-imports"

[tasks.agent-orchestration]
description = "Validate Cursor/Claude production-readiness orchestration mirrors"
run = "python3 .agent-work/production-readiness/scripts/check_orchestration.py"

# ---------------------------------------------------------------------------
# Reproducible baselines (correctness, latency, compiler-free install)
#
# Kept out of ci-local/all-tests: each needs a live PostgreSQL and/or a
# release build, mirroring how test-integration is already excluded. Nightly
# CI (.github/workflows/nightly.yml) runs the bench-* pair; `baseline` is the
# one local command that runs everything and assembles a single report.
# ---------------------------------------------------------------------------

[tasks.test-consumer-contracts]
description = "Live-PostgreSQL consumer-contract compatibility tests (requires FERRUM_TEST_DSN)"
depends = ["dev"]
run = [
  "mkdir -p benchmarks/latest",
  "uv run pytest tests/python/integration -m integration -k compat -v --junitxml=benchmarks/latest/consumer-contracts.xml",
]

[tasks.smoke-wheel]
description = "Build a wheel and smoke-test it in a fresh venv (proves compiler-free install)"
run = "bash benchmarks/smoke_wheel.sh"

[tasks.bench-rust]
description = "Rust criterion benchmarks (writes target/criterion/**)"
run = "cargo bench --workspace"

[tasks.bench-python]
description = "Python pytest-benchmark suite against a release build (requires FERRUM_TEST_DSN for DB-backed cases)"
depends = ["dev-release"]
run = [
  "mkdir -p benchmarks/latest",
  "uv run pytest tests/python/ -m benchmark --benchmark-json=benchmarks/latest/bench-python.json -v",
]

[tasks.baseline]
description = "Run consumer contracts, wheel smoke, and benchmarks; write one reproducible baseline report"
depends = ["test-consumer-contracts", "smoke-wheel", "bench-rust", "bench-python"]
run = """
python3 benchmarks/collect_baseline.py \
  --out benchmarks/latest/baseline.json \
  --label "$(date -u +%Y%m%dT%H%M%SZ)" \
  --python-benchmark-json benchmarks/latest/bench-python.json \
  --criterion-dir target/criterion \
  --junit benchmarks/latest/consumer-contracts.xml \
  --junit benchmarks/latest/smoke-wheel.xml \
  --timing-json benchmarks/latest/smoke-wheel-timing.json
"""

[tasks.test-benchmarks-harness]
description = "Unit tests for the baseline-collection harness itself (no DB, no native build)"
run = "uv run pytest tests/benchmarks -v"

# ---------------------------------------------------------------------------
# Full local CI parity
# ---------------------------------------------------------------------------

[tasks.ci-local]
description = "Run every required PR gate locally"
depends = [
  "lint",
  "check-rust",
  "boundary",
  "test-rust",
  "type-python",
  "import-boundary",
  "agent-orchestration",
  "all-tests",
]
run = "true"

# ---------------------------------------------------------------------------
# Cleanup
# ---------------------------------------------------------------------------

[tasks.clean]
description = "Remove build artifacts and caches"
run = [
  "cargo clean",
  "rm -rf target/ dist/ wheelhouse/ .pytest_cache/ .ruff_cache/",
  "bash -c 'find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true'",
]

[tasks.push]
description = "Lint, commit, push (usage: mise run publish <commit-msg>)"
usage = 'arg "<msg>" help="Commit message"'
run = """
git add .
git commit -m "${usage_msg}"
git push origin $(git branch --show-current)
"""